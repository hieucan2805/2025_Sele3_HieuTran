name: CI/CD Pipeline

# Define global environment variables
env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_CACHE_ENABLED: 'true'
  SELENIUM_HUB_PORT: 4444
  SELENIUM_VERSION: '4.13.0'
  APP_NAME: 'my-app'
  PRODUCTION_URL: 'https://yourapp.com'
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

on:
  push:
    branches: [ main, update-framework-2 ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: target/*.jar

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run SonarQube analysis
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=${{ env.APP_NAME }} -Dsonar.organization=my-org -Dsonar.host.url=https://sonarcloud.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test:
    runs-on: ubuntu-latest
    services:
      selenium-hub:
        image: selenium/hub:${{ env.SELENIUM_VERSION }}
        ports:
          - ${{ env.SELENIUM_HUB_PORT }}:4444
      chrome:
        image: selenium/node-chrome:${{ env.SELENIUM_VERSION }}
        volumes:
          - /dev/shm:/dev/shm
        env:
          SE_EVENT_BUS_HOST: selenium-hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
          SE_NODE_MAX_SESSIONS: 4
        options: --shm-size="2g"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests with Maven
        run: mvn clean test -Dselenide.remote=http://localhost:${{ env.SELENIUM_HUB_PORT }}/wd/hub
        env:
          TEST_ENVIRONMENT: 'CI'
          BROWSER: 'chrome'
          HEADLESS: 'true'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/screenshots/

  deploy-staging:
    needs: [ build, test ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.yourapp.com
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Deploy to staging
        run: echo "Deploy to staging environment"
        env:
          DEPLOY_ENV: 'staging'
          API_KEY: ${{ secrets.STAGING_API_KEY }}

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Deploy to production
        run: echo "Deploy to production environment"
        env:
          DEPLOY_ENV: 'production'
          API_KEY: ${{ secrets.PRODUCTION_API_KEY }}