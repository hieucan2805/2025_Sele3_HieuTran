name: Selenide Automation Tests

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  SELENIUM_HUB_PORT: 4444
  SELENIUM_VERSION: '4.13.0'

on:
  push:
    branches: [ main, master, develop, update-framework-2 ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options:
        - chrome
        - edge
      project:
        description: 'Project to test'
        required: true
        default: 'VjAir'
        type: choice
        options:
        - VjAir
        - Agoda
      headless:
        description: 'Run in headless mode'
        required: true
        default: true
        type: boolean
      use_grid:
        description: 'Use Selenium Grid'
        required: false
        default: true
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Capture start time
        id: get_start_time
        run: echo "start_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Setup Selenium Grid
        if: ${{ github.event.inputs.use_grid != false }}
        run: |
          docker-compose up -d

      - name: Wait for Selenium Grid
        if: ${{ github.event.inputs.use_grid != false }}
        run: |
          echo "Waiting for Selenium Grid to be ready..."
          timeout=60
          start_time=$(date +%s)
          while ! curl -sSL "http://localhost:4444/wd/hub/status" | grep -q "\"ready\":true"; do
            current_time=$(date +%s)
            elapsed=$((current_time - start_time))
            if [ $elapsed -gt $timeout ]; then
              echo "Timed out waiting for Selenium Grid"
              exit 1
            fi
            echo "Waiting for Selenium Grid... ($elapsed seconds)"
            sleep 2
          done
          echo "Selenium Grid is ready!"

      - name: Run Tests
        run: |
          # Determine which browser and project to run based on workflow dispatch inputs or default values
          BROWSER="${{ github.event.inputs.browser || 'chrome' }}"
          PROJECT="${{ github.event.inputs.project || 'VjAir' }}"
          HEADLESS="${{ github.event.inputs.headless }}"
          USE_GRID="${{ github.event.inputs.use_grid }}"
          
          # Convert boolean inputs to selenide parameter format
          if [ "$HEADLESS" = "true" ]; then
            HEADLESS_PARAM="true"
          else
            HEADLESS_PARAM="false"
          fi
          
          # Set remote URL based on grid usage preference
          REMOTE_URL=""
          if [ "$USE_GRID" = "true" ]; then
            REMOTE_URL="http://localhost:4444/wd/hub"
          else
            REMOTE_URL="false"
          fi
          
          # Run tests with Maven
          mvn clean test \
            -Dselenide.browser="$BROWSER" \
            -Dselenide.remote="$REMOTE_URL" \
            -Dselenide.projectName="$PROJECT" \
            -Dselenide.headless="$HEADLESS_PARAM"

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            allure-results/
            testng-report/

      - name: Send test‑result email
        if: always()               # Both on success and failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to:       hieucan1991@gmail.com
          from:     ${{ secrets.MAIL_USERNAME }}

          subject: >
            [AGEST][SELE3] Test Result – ${{ job.status }} – ${{ steps.get_start_time.outputs.start_time }}

          body: |
            Hello,
            
            Test run has completed.
            
            • Status     : ${{ job.status }}
            • Start time : ${{ steps.get_start_time.outputs.start_time }}
            
            See details in the attached report.
            
            Regards,
            GitHub Actions

          attachments: |
            target/allure-report/index.html

